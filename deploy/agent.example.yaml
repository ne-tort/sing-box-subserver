# Example agent config for sing-box-subserver.
# Copy to agent.local.yaml (gitignored) or /etc/subserver/agent.yaml.
#
# IMPORTANT: pull/heartbeat in this file are BOOTSTRAP SEED ONLY.
# After first start (or after REST configure), runtime state lives in data_dir:
#   subscribe-state.json / heartbeat-state.json
# Restart does NOT re-apply YAML over REST-disabled settings.
# Install env vars are write-once into this file by install scripts — the Go
# process never reads env for pull/heartbeat.

node_id: "edge-ams-1"
token: "replace-with-high-entropy-secret"
listen: "127.0.0.1:8080"
data_dir: "/var/lib/subserver"

# Public bind without TLS requires explicit opt-in (logged as warn).
# insecure_public_bind: false

# Post-start settle before promote (milliseconds). 0 disables.
# probe_ms: 300

# Optional pull (= subscribe): any URL returning server JSON (plain or encrypted envelope).
# Not tied to s-ui. Defaults: interval_sec=60, jitter_sec=10, timeout_sec=15.
# pull:
#   url: "https://example.com/subserver/edge-ams-1"
#   interval_sec: 60
#   jitter_sec: 10
#   timeout_sec: 15
#   headers:
#     Authorization: "Bearer replace-with-high-entropy-secret"

# Optional heartbeat: POST status JSON to any URL. Defaults: interval_sec=30, timeout_sec=10.
# heartbeat:
#   url: "https://example.com/hooks/edge-status"
#   interval_sec: 30
#   timeout_sec: 10

# Optional TLS for non-localhost listen
# tls:
#   cert: "/etc/subserver/tls.crt"
#   key: "/etc/subserver/tls.key"

# Embedded controlplane (requires binary built with with_controlplane).
# public_host MUST be a hostname/IP reachable by VPN clients — not 127.0.0.1 —
# or subscription_url will be useless on phones.
# controlplane:
#   public_host: "vpn.example.com"
#   public_port: 8080
#   expiry_tick_sec: 60

log:
  level: info
