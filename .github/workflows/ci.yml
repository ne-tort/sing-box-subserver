name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-vet-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init sing-box-lx (+ wireguard-go only)
        run: |
          git submodule update --init third_party/sing-box-lx
          git -C third_party/sing-box-lx submodule update --init submodules/wireguard-go

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: Read build tags
        id: tags
        run: |
          TAGS=$(tr -d '\r\n' < build/tags.server)
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          test -n "$TAGS"

      - name: Tags allowlist
        run: |
          # Workflow must use exactly build/tags.server (no inventing tags).
          FILE_TAGS=$(tr -d '\r\n' < build/tags.server)
          test "${{ steps.tags.outputs.tags }}" = "$FILE_TAGS"

      - name: Version ldflags
        id: ver
        run: |
          AGENT_COMMIT=$(git rev-parse --short HEAD)
          AGENT_VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "$AGENT_COMMIT")
          LX_COMMIT=$(git -C third_party/sing-box-lx rev-parse --short HEAD)
          {
            echo "agent_commit=$AGENT_COMMIT"
            echo "agent_version=$AGENT_VERSION"
            echo "lx_commit=$LX_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        if: matrix.goarch == 'amd64'
        run: go test -ldflags="-checklinkname=0" -tags "${{ steps.tags.outputs.tags }}" ./...

      - name: Test controlplane
        if: matrix.goarch == 'amd64'
        run: |
          CP_TAGS=$(tr -d '\r\n' < build/tags.server.controlplane)
          go test -ldflags="-checklinkname=0" -tags "$CP_TAGS" ./internal/controlplane/... ./internal/configowner/...

      - name: Test traffic
        if: matrix.goarch == 'amd64'
        run: |
          T_TAGS=$(tr -d '\r\n' < build/tags.server.traffic)
          go test -ldflags="-checklinkname=0" -tags "$T_TAGS" ./internal/traffic/... ./internal/box/...

      - name: Test traffic+controlplane
        if: matrix.goarch == 'amd64'
        run: |
          TC_TAGS=$(tr -d '\r\n' < build/tags.server.traffic.controlplane)
          go test -ldflags="-checklinkname=0" -tags "$TC_TAGS" ./internal/traffic/... ./internal/controlplane/... ./internal/app/...

      - name: Vet
        if: matrix.goarch == 'amd64'
        run: go vet -tags "${{ steps.tags.outputs.tags }}" ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -checklinkname=0"
          LDFLAGS="$LDFLAGS -X github.com/ne-tort/sing-box-subserver/internal/version.AgentVersion=${{ steps.ver.outputs.agent_version }}"
          LDFLAGS="$LDFLAGS -X github.com/ne-tort/sing-box-subserver/internal/version.AgentCommit=${{ steps.ver.outputs.agent_commit }}"
          LDFLAGS="$LDFLAGS -X github.com/ne-tort/sing-box-subserver/internal/version.SingBoxCommit=${{ steps.ver.outputs.lx_commit }}"
          go build -trimpath -ldflags="$LDFLAGS" \
            -tags "${{ steps.tags.outputs.tags }}" \
            -o "dist/subserver_${{ matrix.goos }}_${{ matrix.goarch }}" \
            ./cmd/subserver
          ls -la "dist/subserver_${{ matrix.goos }}_${{ matrix.goarch }}"

      - name: Version smoke (amd64 host)
        if: matrix.goarch == 'amd64'
        run: ./dist/subserver_linux_amd64 -version
